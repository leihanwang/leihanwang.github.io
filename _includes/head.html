{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  try {
    localStorage.setItem('theme', 'light');
  } catch (e) {}
  document.documentElement.removeAttribute('data-theme');
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<style>
  :root { color-scheme: light; }

  html,
  body {
    background: #ffffff !important;
    color: #222222 !important;
  }

  /* University at Buffalo-style masthead */
  .masthead,
  .masthead__inner-wrap,
  .masthead__menu,
  #site-nav.greedy-nav,
  #site-nav.greedy-nav .visible-links,
  #site-nav.greedy-nav .visible-links > li,
  .masthead__menu-item {
    background: #005BBB !important;
    background-color: #005BBB !important;
  }

  /* Make the UB-blue bar taller */
  .masthead__inner-wrap {
    padding-top: 0.9em !important;
    padding-bottom: 0.9em !important;
  }

  #site-nav.greedy-nav a {
    padding-top: 0.65rem !important;
    padding-bottom: 0.65rem !important;
  }

  /* 3px gold trim below the UB-blue navigation bar */
  .masthead {
    border: 0 !important;
    border-bottom: 3px solid #FFB81C !important;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06) !important;
  }

  .masthead::after {
    background: #FFB81C !important;
    height: 3px !important;
  }

  #site-nav.greedy-nav a,
  #site-nav.greedy-nav a:visited,
  .masthead__menu-item a,
  .masthead__menu-item a:visited {
    color: #ffffff !important;
  }

  #site-nav.greedy-nav a:hover,
  .masthead__menu-item a:hover {
    color: #ffffff !important;
    opacity: 0.88;
  }

  .masthead__menu-item.selected > a {
    color: #ffffff !important;
    border-bottom: 3px solid #ffffff !important;
  }

  #site-nav.greedy-nav .visible-links a::before,
  .masthead__menu-item.selected > a::before {
    background: #ffffff !important;
  }

  #site-nav.greedy-nav button {
    background: #005BBB !important;
    color: #ffffff !important;
  }

  #site-nav.greedy-nav .hidden-links,
  #site-nav.greedy-nav .hidden-links li {
    background: #005BBB !important;
  }

  #theme-toggle,
  #theme-icon {
    display: none !important;
  }
</style>
